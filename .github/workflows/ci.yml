name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Install and build with pnpm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild bundled Cordis runtime
        run: pnpm run build

      - name: Check bundle reproducibility
        run: git diff --exit-code -- src/libre_claw/cordis_runtime/vendor

      - name: Test Cordis runtime
        run: pnpm run test:runtime

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node for offline Cordis plugin tests
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Enable confined plugin process tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # The disposable Ubuntu runner must permit the namespaces used by
          # bubblewrap; production still fails closed when they are unavailable.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev /bin/true

      - name: Run pytest
        run: python -m pytest -W error

      - name: Verify bundled Cordis runtime
        run: node --test src/libre_claw/cordis_runtime/tests/*.test.mjs src/libre_claw/cordis_runtime/compat/tests/*.test.mjs

      - name: Validate fixed coding workflows without model credentials
        run: python -m benchmarks.coding_workflow.runner --offline --output artifacts/coding-workflow

      - name: Compile source and tests
        run: python -m compileall src tests

      - name: Check whitespace
        run: git diff --check

  package:
    name: Package and verify distribution
    runs-on: ubuntu-latest
    needs: [test, runtime]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build and validate packages
        run: pnpm run package

      - name: Check packaged bundles match the tested source
        run: git diff --exit-code -- src/libre_claw/cordis_runtime/vendor

      - name: Test installation outside the checkout
        run: python scripts/smoke_package.py

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libre-claw-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/package-manifest.json
          if-no-files-found: error
